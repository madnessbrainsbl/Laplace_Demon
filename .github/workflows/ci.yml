name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python unit tests
        run: python -m unittest -v

      - uses: actions/setup-go@v5
        with:
          go-version-file: native_quantum/go.mod

      - name: Go vet
        working-directory: native_quantum
        run: go vet ./...

      - name: Go tests
        working-directory: native_quantum
        run: go test -count=1 ./...
